<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predictive Skill Gap Analyzer</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Predictive Skill Gap Analyzer</h1>

        <p class="quote">
            “Bridging the skill gap today prepares students for the careers of tomorrow.”
        </p>

        <!-- ✅ Guidance Text Added -->
        <p class="guide">
            Describe your skills and experience clearly. <br>
            Example: “I have Python and SQL skills with 1 year experience.”
        </p>

        <textarea id="inputText"
            placeholder="Type your skills and experience here...">
        </textarea>

        <button id="analyzeBtn">
            Analyze
        </button>

        <pre id="result">
Results will appear here...
        </pre>

    </div>

    <script src="script.js"></script>

</body>
</html>
